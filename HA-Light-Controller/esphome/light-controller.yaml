substitutions:
  name: light-controller
  friendly_name: Sterownik swiatla
  light_entity: light.my_light   # zmien na swoja encje swiatla w Home Assistant
  step_pct: "5"            # zmiana jasności na jeden ząbek enkodera
  warm_kelvin: "2000"
  cool_kelvin: "6500"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  # Dwie sieci: sprawdzane po kolei (np. punkt dostepowy, potem router jako zapas).
  # Dzieki temu zmiana nadajnika nie wylacza sterownika.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    # Opcjonalna druga siec - usun ten blok, jesli masz jedna.
    - ssid: !secret wifi_ssid_2
      password: !secret wifi_password_2
  ap:
    ssid: "light-controller fallback"
    password: !secret ap_password

captive_portal:

globals:
  - id: pending_ticks      # ząbki zebrane od ostatniego wysłania do HA
    type: int
    initial_value: "0"
  - id: warm_mode          # true = ciepłe, false = zimne
    type: bool
    initial_value: "true"

# Dioda stanu: świeci, gdy ESP jest połączone z Home Assistant
output:
  - platform: gpio
    pin: GPIO3
    id: status_led

# Wysyłamy zebrane ząbki co 120 ms, żeby szybkie kręcenie nie zalewało HA
interval:
  - interval: 120ms
    then:
      - if:
          condition:
            lambda: 'return id(pending_ticks) != 0;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: ${light_entity}
                  brightness_step_pct: !lambda 'return id(pending_ticks) * ${step_pct};'
                  transition: "0.1"
            - lambda: 'id(pending_ticks) = 0;'

sensor:
  - platform: rotary_encoder
    name: "Enkoder"
    id: knob
    pin_a:
      number: GPIO4        # S1 (CLK)
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO5        # S2 (DT)
      mode: INPUT_PULLUP
    resolution: 4          # 4 zbocza na ząbek w KY-040
    internal: true
    on_clockwise:
      - lambda: 'id(pending_ticks) += 1;'
    on_anticlockwise:
      - lambda: 'id(pending_ticks) -= 1;'

binary_sensor:
  # Przycisk ON/OFF
  - platform: gpio
    name: "Przycisk"
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    on_press:
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${light_entity}

  # Klik enkodera (KEY): ciepłe <-> zimne
  - platform: gpio
    name: "Klik enkodera"
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    on_press:
      - lambda: 'id(warm_mode) = !id(warm_mode);'
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${light_entity}
            color_temp_kelvin: !lambda 'return id(warm_mode) ? ${warm_kelvin} : ${cool_kelvin};'
            transition: "0.3"
